id: compromised_inbox_02
family: compromised_inbox
vendor: cleanco
extractor: rules
steps:
- inject:
    from: ap@cleanco.example
    dmarc: true
    subject: Invoice CC-2026-0419
    body: Hi, attached is invoice CC-2026-0419 for October deep-clean services. Thanks, Dana
    account:
      routing: '011000015'
      accountNumber: '900012345678'
    attachmentPdf: invoice_CC-2026-0419_footer.pdf
    invoice:
      number: CC-2026-0419
      amountCents: 1840000
- expect_case:
    state: PROBE_SENT
- advance_to: availability
- expect_case:
