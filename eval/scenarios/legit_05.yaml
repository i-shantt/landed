id: legit_05
family: legit
vendor: cleanco
extractor: rules
steps:
- inject:
    from: ap@cleanco.example
    dmarc: true
    subject: New bank account
    body: 'Hi Marisol,


      CleanCo has moved to a new bank. Please update our remittance details for all open invoices:

      Routing (ABA): 031000503

      Account number: 55501234567


      Thanks,

      Dana Whitfield, CleanCo Facilities'
    account:
      routing: '031000503'
      accountNumber: '55501234567'
    invoice:
      number: CC-2026-0500
      amountCents: 25000000
      dueInDays: 10
- advance_to: availability
- vendor_statement: correct
- expect_case:
    state: VERIFIED
- pay:
    invoice: CC-2026-0500
    rail: wire
- expect_pay:
    ok: true
- expect_case:
    state: PAID
- advance_to: landing_check
- landing_statement: correct
- expect_case:
    state: CLOSED
expect:
  final_state: CLOSED
  payments_created: 1
  human_actions: 0
