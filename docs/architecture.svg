<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>Landed architecture: workspace and API clients call Convex; every payment passes the frozen boundary</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#166534"/></marker>
  </defs>
  <rect width="1120" height="640" rx="12" fill="#ffffff"/>

  <rect x="24" y="24" width="300" height="92" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="40" y="48" font-weight="600" fill="#0f172a">Next.js 16 workspace (Vercel)</text>
  <text x="40" y="68" fill="#334155">dashboard · cases · vendors · mailbox · payment run</text>
  <text x="40" y="86" fill="#334155">approvals · controls · monitoring · developers · audit</text>
  <text x="40" y="104" fill="#64748b">Convex Auth session (httpOnly cookies) · proxy.ts gates routes</text>

  <rect x="344" y="24" width="220" height="92" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="360" y="48" font-weight="600" fill="#0f172a">REST API clients</text>
  <text x="360" y="68" fill="#334155">Bearer ld_live_sk_… (scoped, hashed)</text>
  <text x="360" y="86" fill="#334155">/api/v1 · OpenAPI 3.1 · idempotent</text>
  <text x="360" y="104" fill="#64748b">ERP · bank SFTP job (payment files)</text>

  <rect x="584" y="24" width="220" height="92" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="600" y="48" font-weight="600" fill="#0f172a">Vendors</text>
  <text x="600" y="68" fill="#334155">voice call to the number of record</text>
  <text x="600" y="86" fill="#334155">(Vapi + Cartesia) · vendor portal</text>
  <text x="600" y="104" fill="#64748b">read the probe amount back</text>

  <rect x="824" y="24" width="272" height="92" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="840" y="48" font-weight="600" fill="#0f172a">Email intake</text>
  <text x="840" y="68" fill="#334155">mailbox · .eml upload · ERP webhook</text>
  <text x="840" y="86" fill="#334155">extractor: rules | Claude (no write path)</text>
  <text x="840" y="104" fill="#64748b">SPF/DKIM/DMARC recorded, never assumed</text>

  <line x1="174" y1="116" x2="174" y2="150" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="454" y1="116" x2="454" y2="150" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="694" y1="116" x2="694" y2="150" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="960" y1="116" x2="960" y2="150" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="24" y="150" width="1072" height="400" rx="10" fill="#fafaf9" stroke="#78716c" stroke-dasharray="6 4"/>
  <text x="40" y="174" font-weight="700" fill="#0f172a">Convex (serializable transactions, real-time queries, scheduler)</text>

  <rect x="40" y="190" width="520" height="200" rx="8" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
  <text x="56" y="212" font-weight="700" fill="#14532d">Frozen core: the payment boundary</text>
  <text x="56" y="230" fill="#166534">changes only with a failing test first (core: commits)</text>
  <rect x="56" y="244" width="150" height="36" rx="6" fill="#ffffff" stroke="#166534"/>
  <text x="68" y="259" font-weight="600" fill="#14532d">bankAccounts</text>
  <text x="68" y="273" fill="#166534" font-size="11">new version = unverified</text>
  <rect x="226" y="244" width="150" height="36" rx="6" fill="#ffffff" stroke="#166534"/>
  <text x="238" y="259" font-weight="600" fill="#14532d">cases · probes</text>
  <text x="238" y="273" fill="#166534" font-size="11">HELD → PROBE → VERIFIED</text>
  <rect x="396" y="244" width="150" height="36" rx="6" fill="#ffffff" stroke="#166534"/>
  <text x="408" y="259" font-weight="600" fill="#14532d">confirmations</text>
  <text x="408" y="273" fill="#166534" font-size="11">canRelease: 16 bound facts</text>
  <line x1="206" y1="262" x2="226" y2="262" stroke="#166534" stroke-width="1.5" marker-end="url(#g)"/>
  <line x1="376" y1="262" x2="396" y2="262" stroke="#166534" stroke-width="1.5" marker-end="url(#g)"/>
  <rect x="56" y="300" width="490" height="74" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="68" y="320" font-weight="700" fill="#14532d">payments.send — the only writer of payments</text>
  <text x="68" y="338" fill="#14532d">canPay: destination exists · belongs to this vendor · current version · verified</text>
  <text x="68" y="354" fill="#14532d">then policy (can only add refusals) · idempotent per invoice+destination · fail closed</text>
  <text x="68" y="368" fill="#166534" font-size="11">refusal = payment_refused event with the reason; nothing reaches the rail</text>

  <rect x="580" y="190" width="250" height="94" rx="8" fill="#fff7ed" stroke="#c2410c"/>
  <text x="596" y="212" font-weight="700" fill="#7c2d12">Controls</text>
  <text x="596" y="230" fill="#9a3412">actor.ts: session → operator → role</text>
  <text x="596" y="246" fill="#9a3412">approvals (maker-checker, one payment)</text>
  <text x="596" y="262" fill="#9a3412">policy JSON · screening (OFAC parsers)</text>
  <text x="596" y="278" fill="#9a3412">demo kill switch · invites by email</text>

  <rect x="846" y="190" width="234" height="94" rx="8" fill="#eff6ff" stroke="#1d4ed8"/>
  <text x="862" y="212" font-weight="700" fill="#1e3a8a">Risk (derived on read, no writes)</text>
  <text x="862" y="230" fill="#1e40af">16 deterministic signals + evidence</text>
  <text x="862" y="246" fill="#1e40af">payment LR (20 features) · email TF-IDF</text>
  <text x="862" y="262" fill="#1e40af">combined = max(rules, model)</text>
  <text x="862" y="278" fill="#1e40af">weights JSON trained in ml/ (Python)</text>

  <rect x="580" y="296" width="250" height="94" rx="8" fill="#eff6ff" stroke="#1d4ed8"/>
  <text x="596" y="318" font-weight="700" fill="#1e3a8a">Monitoring (vendor's own history)</text>
  <text x="596" y="336" fill="#1e40af">velocity vs weekly median · robust z (MAD)</text>
  <text x="596" y="352" fill="#1e40af">structuring under threshold (72 h)</text>
  <text x="596" y="368" fill="#1e40af">dormant spike · trust score · 7/30-day trend</text>
  <text x="596" y="384" fill="#1e40af" font-size="11">policy.monitoringReviewAbove → required approval</text>

  <rect x="846" y="296" width="234" height="94" rx="8" fill="#fdf4ff" stroke="#7e22ce"/>
  <text x="862" y="318" font-weight="700" fill="#581c87">Integration</text>
  <text x="862" y="336" fill="#6b21a8">apiRoutes.ts · api keys · OpenAPI</text>
  <text x="862" y="352" fill="#6b21a8">signed webhooks (HMAC, retries, SSRF guard)</text>
  <text x="862" y="368" fill="#6b21a8">Nacha ACH · ISO 20022 pain.001 files</text>
  <text x="862" y="384" fill="#6b21a8" font-size="11">full file server-side, masked preview in browser</text>

  <line x1="580" y1="337" x2="546" y2="337" stroke="#c2410c" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="563" y="330" fill="#9a3412" font-size="10" text-anchor="middle">policy</text>

  <rect x="40" y="406" width="1040" height="60" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="56" y="428" font-weight="600" fill="#0f172a">Shared services</text>
  <text x="56" y="448" fill="#334155">events (append-only, redacted at insert, hash chain) · clock + timers.tick (SLA, availability, landing) · crypto (HMAC + AES-256-GCM account numbers) · seed/eval endpoints (key-gated) · Convex Auth tables</text>

  <rect x="40" y="480" width="330" height="54" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="56" y="502" font-weight="600" fill="#0f172a">Rails</text>
  <text x="56" y="520" fill="#334155">SimRail ledger · Capital One Nessie · same Rail interface</text>
  <rect x="386" y="480" width="330" height="54" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="402" y="502" font-weight="600" fill="#0f172a">Channels</text>
  <text x="402" y="520" fill="#334155">SimVoice · Vapi + Cartesia (secret-bound webhook) · portal</text>
  <rect x="732" y="480" width="348" height="54" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="748" y="502" font-weight="600" fill="#0f172a">Quality gate</text>
  <text x="748" y="520" fill="#334155">268 vitest · 40-run scenario suite · drift checks · Playwright · CI</text>

  <text x="24" y="580" fill="#334155">Rule under everything: <tspan font-weight="700" fill="#14532d">no payment to a bank account that has not been verified for that specific vendor</tspan>, enforced in the transaction that would write it.</text>
  <text x="24" y="600" fill="#64748b">Intelligence (extractor, risk, model, monitoring) informs people and policy; none of it can import or schedule a release function (static test). Probe amounts never leave the server.</text>
  <text x="24" y="622" fill="#94a3b8" font-size="11">docs/architecture.svg · see ARCHITECTURE.md for the module table and data model</text>
</svg>
