name: ML pipeline

# Manual: reproduces the learned layer from public data on a clean runner (fetch → features → train →
# export → scenarios → evaluate → model card) and fails if the committed artifacts differ from what it
# produced. Needs no secrets: the datasets are public Hugging Face files (see ml/data/sources.py).
on:
  workflow_dispatch:

jobs:
  reproduce:
    name: make -C ml all, then diff the committed artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Cache raw datasets
        uses: actions/cache@v5
        with:
          path: ml/data/raw
          key: ml-raw-${{ hashFiles('ml/data/MANIFEST.json') }}
      - run: make -C ml all
      - name: Committed artifacts are byte-for-byte what a clean run produces
        run: git diff --exit-code --stat -- ml/artifacts/metrics.json ml/artifacts/transaction_lr.json ml/artifacts/email_tfidf_lr.json web/convex/risk/weights README.md
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ml-artifacts
          path: ml/artifacts
          retention-days: 30
